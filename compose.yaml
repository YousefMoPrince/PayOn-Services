services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=PayOn_DB_Test'
      - 'POSTGRES_USER=myuser'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      - '5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d PayOn_DB_Test"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: 'mongo:latest'
    environment:
      - 'MONGO_INITDB_ROOT_USERNAME=root'
      - 'MONGO_INITDB_ROOT_PASSWORD=secret'
      - 'MONGO_INITDB_DATABASE=PayOn_DB_TestNS'
    ports:
      - '27017'